name: Ruby

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest
    name: Test against Ruby ${{ matrix.ruby-version }} / Rails ${{ matrix.rails }}

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', '3.4', '3.3']
        rails: ['8.0', '8.1']

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.rails }}.gemfile

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_db_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        env:
          WAZOWSKI_PG_DATABASE: ci_db_test
          WAZOWSKI_PG_USERNAME: postgres
          WAZOWSKI_PG_PASSWD: postgres
          WAZOWSKI_PG_HOST: localhost
          WAZOWSKI_PG_PORT: 5432
        run: bundle exec rake
